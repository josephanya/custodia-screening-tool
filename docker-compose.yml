name: custodia-screening-tool

services:
  db:
    image: postgres:17-alpine
    container_name: custodia-screening-tool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: custodia_screening_tool
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d custodia_screening_tool" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
